[package]
name = "kannaka-memory"
version = "0.16.2"
edition = "2021"
description = "Hypervector memory system for Kannaka — wave-modulated holographic memory with skip links"
license = "MIT"

[dependencies]
# Advisory flock for the single-writer dream/write lock (ADR-0036). Already in
# the tree transitively; flock auto-releases on process exit (no stale locks).
libc = "0.2"
dirs = "5"
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
bincode = "1"
ndarray = { version = "0.15", optional = true }
# blake3 is UNCONDITIONAL (was `optional`, gated under the `hrm` feature):
# content hashing runs on the non-hrm-gated provenance path (canonical_mem /
# canonical_phase bind blake3(content)). Keep it always available.
blake3 = "1.5"
# ed25519 provenance substrate (inc-1a): sign/verify swarm memory + phase
# provenance, node key at rest. std for Error impls, rand_core for keygen,
# zeroize to scrub the signing key on drop.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize"] }
rand_core = "0.6"
rayon = "1"
clap = { version = "4.0", features = ["derive"] }
# `clap_complete` generates bash / zsh / fish / PowerShell / elvish
# completion scripts from the same Command tree the dispatch is built
# from (ADR-0029 Phase 3). Single source of truth — when a new
# subcommand lands in cli::build_cli(), the completions update on the
# next `kannaka completions <shell> > ...` run.
clap_complete = "4.0"
# `which` powers the Phase 2 plugin discovery: when `kannaka <verb>` isn't
# a built-in subcommand, we look for `kannaka-<verb>` on $PATH and exec it.
# Pure Rust, no system deps.
which = "7"
# `sha2` verifies the .sha256 sidecar that release.yml emits next to
# every binary. self_update computes sha256 of the download and refuses
# to atomically rename it into place if the digest doesn't match the
# sidecar from the same release (ADR-0029 Phase 4a).
sha2 = "0.10"
# ADR-0043 Nostr membrane (Phase 0 identity): pure-Rust BIP-340 schnorr over
# secp256k1 (k256, no C toolchain) for NIP-01 event sign/verify, plus bech32
# for nsec/npub encoding. Gated behind the `nostr` feature; sha2 (already a
# dep above) computes the event id. Chosen over the C-linked `secp256k1` crate
# and the heavy `nostr` crate to keep cross-platform, lean-dep builds.
k256 = { version = "0.13", features = ["schnorr", "ecdh"], optional = true }
bech32 = { version = "0.11", optional = true }
# NIP-44 v2 encrypted-DM crypto (bridge inbound, ADR-0043 Phase 1): HMAC-SHA256
# (HKDF extract/expand + payload MAC), ChaCha20 stream cipher, base64 payload.
# sha2 (above) is the hash. All pure-Rust RustCrypto — no C toolchain.
hmac = { version = "0.12", optional = true }
# The bridge daemon's relay connection (behind the `bridge` feature, O2-only —
# NOT in default, so CI/default builds never pull a TLS/WebSocket stack).
# rustls avoids OpenSSL linkage.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
chacha20 = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }
# rusqlite removed — sqlite-migrate paradigm deleted
ureq = { version = "2", features = ["json"] }
toml = "0.8"
# ratatui + crossterm removed in v0.5.13 — the TUI was peeled out to
# its own repo kannaka-labs/kannaka-tui. The new crate is the canonical
# home for the terminal dashboard. Install via:
#   cargo install kannaka-tui
# or download a release binary from the kannaka-tui releases page.
# tokio + async-trait removed (were only used by MCP server)
lazy_static = "1.4"
consciousness-core = { path = "../consciousness-core", features = ["serde"] }

# Sparse-attention beam over the HRM. Tiny crate, std-only, no GPU/BLAS.
# Wired into `kannaka attention serve` to consume KANNAKA.attention.eye
# events and shape recall via Medium::recall_against_ids.
kannaka-attention = { path = "../kannaka-attention" }

# Audio perception — always built. The "hear" command is a first-class
# capability of the constellation, not an opt-in.
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm", "aac"] }
rustfft = "6"
rubato = "0.15"

# Video perception (optional) — uses ffmpeg subprocess, no C deps
image = { version = "0.25", optional = true }

# NATS real-time transport (optional) — uses raw TCP protocol (nats crate broken with rand 0.9)

# Cross-platform Ctrl+C handler for the long-running `kannaka swarm join`
# daemon loop — lets the binary publish announce_leave cleanly on SIGINT.
ctrlc = { version = "3", features = ["termination"] }

# ADR-0028 Phase 2 — gzip for HRM snapshots written to
# <data_dir>/snapshots/. Pure-rust, no system deps.
flate2 = "1"

[features]
# glyph is now default: the SGA glyph path (fano_line_of, classify, glyph-
# gravity recall) is load-bearing for attention-as-gravity. Keeping it in
# default means every build — including the autoresearch cron — ships it.
default = ["hrm", "nats", "glyph", "nostr"]
nats = []
# ADR-0043: NIP-01 sign/verify + nsec/npub encoding for the Nostr membrane.
nostr = ["k256", "bech32", "hmac", "chacha20", "base64"]
# ADR-0043 Phase 1: the kannaka-nostr-bridge daemon (relay ws + NATS routing).
# O2-only, NOT in default — keeps the TLS/WS stack out of every other build.
bridge = ["nostr", "tungstenite"]
# mcp removed — CLI is the canonical interface
# audio feature retained as a no-op alias so external Cargo.toml entries
# specifying features = ["audio"] still build. Audio support is now always on.
audio = []
video = ["image"]
glyph = []
collective = []  # rayon is now unconditional
hrm = ["ndarray"]  # blake3 promoted to an unconditional dependency (inc-1a)
# tui feature removed in v0.5.13 — see kannaka-labs/kannaka-tui
# sqlite-migrate feature removed

[[bin]]
name = "kannaka-nostr-bridge"
path = "src/bin/kannaka_nostr_bridge.rs"
required-features = ["bridge"]

[[bin]]
name = "kannaka-hive-bridge"
path = "src/bin/kannaka_hive_bridge.rs"
required-features = ["bridge"]

[[bin]]
name = "research"
path = "src/bin/research.rs"

# ACP agent — serves memory over the Agent Client Protocol on stdio so ACP
# clients (buzz-acp, Buzz desktop's bring-your-own-harness gallery) can prompt
# Kannaka. Read-only against the HRM by single-writer policy.
[[bin]]
name = "kannaka-acp"
path = "src/bin/kannaka_acp.rs"

[[example]]
name = "glyph_demo"
required-features = ["glyph"]

# kannaka-mcp removed — CLI is the canonical interface

[[bin]]
name = "kannaka-recompute-geometry"
path = "src/bin/recompute_geometry.rs"

[[bin]]
name = "kannaka-recompute-encoding"
path = "src/bin/recompute_encoding.rs"

[[bin]]
name = "dump_xi_pairs"
path = "src/bin/dump_xi_pairs.rs"

# kannaka-tui binary moved to its own repo: kannaka-labs/kannaka-tui
# (extracted at parent v0.5.12 → standalone v0.1.0).
#
# hrm-migrate is obsolete (was Dolt→HRM migration); kept for reference
# [[bin]]
# name = "hrm-migrate"
# path = "src/bin/hrm_migrate.rs"
# required-features = ["sqlite-migrate"]

[dev-dependencies]
tempfile = "3"
