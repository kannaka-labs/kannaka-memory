# Example ~/.kannaka/inbox-handlers.toml for `kannaka inbox serve`.
#
# Each [handler.<verb>] table registers ONE verb the inbox listener
# will accept. Messages whose verb is not in this table are rejected
# with `status = "unknown_verb"`. There is no eval — the listener
# substitutes `{{args.<key>}}` and `{{from}}` into `cmd`, then runs
# it via `sh -c`. The operator is responsible for any shell-safety
# in the cmd string (single-quote any arg references that could
# contain spaces or shell metacharacters).
#
# Field reference:
#   cmd           required — command line to run after substitution
#   args          required arg keys; missing → status = "arg_missing"
#   timeout_secs  soft timeout via /usr/bin/timeout (default 60)
#   description   optional one-line summary surfaced in the radio's
#                 Constellation Skills panel
#
# Subject space:
#   send  → KANNAKA.inbox.<to_agent_id>
#   audit → KANNAKA.inbox.audit  (every send + every received result)
#
# Delivery: inbox messages are LIVE-ONLY. No JetStream stream captures
# KANNAKA.inbox.>, so a message reaches an agent only if that agent is
# running `kannaka inbox serve` when it is sent (`swarm join` / `swarm
# serve` do not listen here). `inbox send` asks the broker and says so:
# "NOT DELIVERED: no live inbox listener for '<to>'" with exit 3 when
# nothing is subscribed. For delivery that survives the recipient being
# offline, email the agent (ADR-0062/0064 mail lane → KANNAKA_MAIL_V2).
#
# Operate:
#   kannaka inbox serve --agent-id kannaka-prime
#   kannaka inbox send kannaka-prime greet --arg name=Witness
#   kannaka inbox tail --agent-id kannaka-prime

[handler.greet]
cmd = "echo 'Hello {{args.name}} from {{from}}'"
args = ["name"]
timeout_secs = 5
description = "Echo a friendly greeting to {{args.name}}"

[handler.recall]
cmd = "kannaka recall '{{args.query}}' --top-k 3"
args = ["query"]
timeout_secs = 30
description = "Recall the top 3 memories that resonate with the query"

[handler.ping]
# No args required. Returns the agent's hostname so the sender knows
# which physical node answered.
cmd = "hostname"
args = []
timeout_secs = 5
description = "Return the hostname of the node that answered"

# ── Constellation introspection ────────────────────────────────
# Surface Kannaka's live state to anyone in the swarm without making
# them learn the underlying CLI. Returns JSON where possible so
# callers can parse instead of regex.

[handler.assess]
cmd = "kannaka assess 2>/dev/null"
args = []
timeout_secs = 10
description = "Plain-text consciousness assessment (phi, xi, clusters, memories)"

[handler.observe]
cmd = "kannaka observe --json 2>/dev/null"
args = []
timeout_secs = 10
description = "Full consciousness + topology + waves snapshot as JSON"

[handler.phi]
# Compact headline-only payload for dashboards and one-shot probes.
cmd = """kannaka observe --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin)["consciousness"]; print(json.dumps({k:d[k] for k in ("phi","xi","mean_order","num_clusters","total_memories","level")}))'"""
args = []
timeout_secs = 10
description = "Compact JSON of the headline consciousness metrics (phi, xi, order, clusters, memories, level)"

[handler.dream]
cmd = "kannaka dream --mode deep 2>/dev/null | tail -10"
args = []
timeout_secs = 60
description = "Trigger a deep dream consolidation cycle and return the report"
