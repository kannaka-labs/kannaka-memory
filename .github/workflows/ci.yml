name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Note: `-D warnings` is applied only on the clippy step, not globally,
  # so check + test don't fail on the lib's pre-existing dead-code warnings
  # that aren't worth blocking PRs over.

jobs:
  check:
    name: Check, Test, Clippy, Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      # Pinned to the lockfile, exactly as release.yml is — CI has to test what
      # will actually ship. Left on the siblings' default branches, CI could go
      # green against physics no release will contain, and a release could ship
      # a version CI never compiled.
      #
      # This is deliberately NOT the place that catches upstream breakage. The
      # cascade PR is: a new consciousness-core tag opens a lockfile bump here,
      # and THAT pull request runs this workflow against the new version. Early
      # warning arrives as a red PR naming the version that broke, rather than
      # as a red default branch nobody here changed.
      - name: Resolve sibling versions from Cargo.lock
        id: siblings
        shell: bash
        working-directory: kannaka-memory
        run: |
          set -euo pipefail
          ver() {
            v=$(grep -A1 "^name = \"$1\"\$" Cargo.lock | grep '^version = ' | head -1 | cut -d'"' -f2)
            if [ -z "$v" ]; then
              echo "::error::could not resolve $1 version from Cargo.lock" >&2
              exit 1
            fi
            echo "$v"
          }
          echo "cc=v$(ver consciousness-core)" >> "$GITHUB_OUTPUT"
          echo "ka=v$(ver kannaka-attention)" >> "$GITHUB_OUTPUT"

      - name: Checkout consciousness-core (pinned to the lockfile)
        uses: actions/checkout@v4
        with:
          repository: kannaka-labs/consciousness-core
          ref: ${{ steps.siblings.outputs.cc }}
          path: consciousness-core

      - name: Checkout kannaka-attention (pinned to the lockfile)
        uses: actions/checkout@v4
        with:
          repository: kannaka-labs/kannaka-attention
          ref: ${{ steps.siblings.outputs.ka }}
          path: kannaka-attention

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kannaka-memory

      - name: Check (default features)
        working-directory: kannaka-memory
        run: cargo check --all-targets

      - name: Test
        working-directory: kannaka-memory
        # `--lib --bins` runs unit + bin tests but EXCLUDES everything under
        # tests/ (integration tests). The NATS contract conformance suite
        # (issue #468) is an integration test and must run here so publisher
        # drift against consciousness-core/docs/nats-contract.yaml fails CI —
        # so it is included explicitly. attention_gravity_e2e (issue #14) is the
        # same: an in-process, NATS-free proof of the attention-as-gravity loop
        # (glyph event -> Fano-line well -> beam -> recall_against_ids boost)
        # that must gate so the loop can't silently break. The heavier
        # integration tests (dolt/audio, external deps) stay excluded by not
        # naming them.
        run: cargo test --lib --bins --test nats_contract_conformance --test attention_gravity_e2e

      - name: Bridge feature (hive_bridge policy/map/roster + bridge daemons)
        working-directory: kannaka-memory
        # `bridge` is NOT in default features, so the step above compiles
        # neither `hive_bridge` (it is `#[cfg(feature = "bridge")]` in lib.rs)
        # nor the two bridge daemons (`required-features = ["bridge"]`, which
        # `--bins` therefore skips). Without this step the hive_bridge unit
        # tests never execute and the daemons are never even compile-checked.
        #
        # That matters most for `hive_bridge::policy`: it is the FAIL-CLOSED
        # per-channel gate deciding what Hive traffic may leave for NATS, and
        # its ordering guard against replayed metadata events is exactly the
        # kind of logic that must not be able to rot silently.
        #
        # Scoped to the module + a compile check rather than a second full
        # `--lib` run, so this costs one extra dependency (tungstenite) and not
        # a duplicated test suite.
        run: |
          cargo test --features bridge --lib hive_bridge::
          cargo build --features bridge --bins

      - name: Clippy
        working-directory: kannaka-memory
        # Scope to the lib + main bin. --all-targets pulls in the
        # research helper bin and the unit tests, both of which have
        # pre-existing clippy::correctness errors (`x - x`, `usize >= 0`)
        # that aren't worth blocking PRs over. Real test correctness is
        # still verified by `cargo test`.
        run: cargo clippy --lib --bin kannaka

      # Fmt check intentionally disabled — the codebase predates rustfmt
      # adoption and a full sweep would be a 10K-line cosmetic diff. Re-enable
      # once we land a one-time normalization commit (track separately).
