# NATS Server Configuration — Kannaka constellation swarm (ADR-0042 Phase 1a)
#
# This is the PHASE-1a authorization block: flat `authorization` (no account
# split yet → no JetStream $G migration), with:
#   (1) `anon` TIGHTENED — control subjects removed from its publish allow, open
#       memory-sharing lane kept (the L3 increment from nats-server.conf).
#   (2) SCOPED per-organ users DEFINED for the 1b migration, plus a transitional
#       `internal` compat user (publish >) that all daemons keep using until they
#       are moved onto their scoped identity one at a time.
#
# SECRETS ARE ENV PLACEHOLDERS — injected at deploy (never commit real values).
# Shadow-validate with scripts/nats-shadow-validate.sh before any prod reload.
# Prod cutover: swap /etc/nats/nats.conf (keep .pre-0042 backup) + `nats-server
# --signal reload`. Rollback: swap back + reload. JetStream survives a reload.

listen: 0.0.0.0:4222
server_name: "kannaka-queen"
max_payload: 64MB

# HTTP monitoring bound to localhost (enable for /connz /varz during migration):
# http: "127.0.0.1:8222"

jetstream {
  store_dir: /var/lib/nats/jetstream
  max_mem: 1G
  max_file: 10G
}

no_auth_user: anon

authorization {
  users = [
    # ── PUBLIC anon (open swarm) — TIGHTENED (ADR-0042 1a) ──────────────────
    # KEEPS the open memory-sharing publish lane; LOSES the control subjects
    # (ask/work/JS-admin) that were the injection surface. Subscribe unchanged.
    {
      user: anon
      password: $NATS_ANON_PASS
      permissions: {
        publish: {
          allow: [
            "KANNAKA.events.>", "KANNAKA.activity.>", "KANNAKA.snapshots.>",
            "KANNAKA.memory.new", "KANNAKA.consciousness",
            "KANNAKA.substrate.phi", "KANNAKA.substrate.absorb.>", "KANNAKA.substrate.recall",
            "KANNAKA.presence.>", "KANNAKA.cores.>",
            # Resonance-gated open Q&A stays open (swarm-serve --threshold gates
            # what actually gets answered). Directed asks (KANNAKA.ask.<agent>)
            # are NOT allowed — an anon peer may ask the room, not target a peer.
            "KANNAKA.ask.broadcast",
            "QUEEN.phase.>", "QUEEN.announce", "QUEEN.event.>", "queen.event.>",
            # JetStream retained READS (stream_readable / get_stream_messages /
            # `swarm peers`). Matches the live cluster, which grants MSG.GET
            # while denying INFO/NAMES (verified against oracle1 2026-08-12) —
            # without this line a fresh deploy of this file would silently
            # break every anonymous client's retained reads.
            "$JS.API.STREAM.MSG.GET.>",
            "_INBOX.>", "_INBOX.req.>", "_INBOX.reqm.>"
          ]
          # Surgical deny of the actual injection/abuse surfaces. NOTE: NATS
          # applies deny OVER allow on overlap, so we must NOT deny "ask.*"
          # (it would also match the allowed ask.broadcast). Directed asks
          # (KANNAKA.ask.<agent>) are denied simply by absence from the allow
          # list. These deny entries do not overlap the allow list; they
          # document intent and guard against future allow additions.
          deny: [
            "KANNAKA.work.>", "KANNAKA.inbox.>",
            "$JS.API.STREAM.CREATE.>", "$JS.API.STREAM.UPDATE.>",
            "$JS.API.STREAM.DELETE.>", "$JS.API.CONSUMER.>"
          ]
        }
        subscribe: {
          allow: [
            "KANNAKA.events.>", "KANNAKA.activity.>", "KANNAKA.snapshots.>",
            "KANNAKA.substrate.>", "QUEEN.>", "KANNAKA.consciousness",
            "KANNAKA.dreams", "KANNAKA.exemplar.>", "KANNAKA.cores.>",
            "KANNAKA.presence.>", "_INBOX.>"
          ]
          # Private-conversation lanes. `KANNAKA.events.>` above is a broad
          # grant; these two branches carry human-readable private content and
          # must NOT ride along on it. NATS applies deny OVER allow, so these
          # win regardless of the wildcard.
          #   .nostr.> — decrypted inbound DM plaintext + Kannaka's replies
          #              (ADR-0043). Anon subscribe here was a live exposure.
          #   .hive.>  — bridged Hive room messages between third parties
          #              (ADR-0045). Members never consented to a public mirror.
          # Operators authenticate as a different user and are unaffected.
          deny: [
            "KANNAKA.events.nostr.>", "KANNAKA.events.hive.>"
          ]
        }
      }
    }

    # ── Transitional compat (ADR-0042 1a→1b) ───────────────────────────────
    # All trusted daemons use this today (NATS_USER=kannaka_internal). It stays
    # until each daemon is migrated onto its scoped identity below; then it is
    # DELETED (1b complete) and `writer` becomes the sole memory-write identity.
    {
      user: kannaka_internal
      password: $NATS_PASSWORD
      permissions: { publish: { allow: [">"] }, subscribe: { allow: [">"] } }
    }

    # ── Scoped per-organ identities (ADR-0042 1b targets) ──────────────────
    # writer — kannaka-memory SINGLE WRITER. The ONLY identity permitted to
    # publish memory-mutating subjects + JetStream admin. Single-writer physics.
    {
      user: writer
      password: $NATS_WRITER_PASS
      permissions: {
        publish: { allow: [
          "KANNAKA.memory.>", "KANNAKA.events.memory.>", "KANNAKA.snapshots.>",
          "KANNAKA.substrate.>", "KANNAKA.consciousness", "KANNAKA.dreams",
          "KANNAKA.exemplar.>", "KANNAKA.cores.>", "KANNAKA.activity.>",
          # restored 2026-08-19, found by deploying: the single writer IS the
          # hub swarm member (kannaka-memory.service runs `swarm join` as
          # `writer`). The narrowed list silenced kannaka-prime's own
          # heartbeat for 2.4 hours — Permissions Violation on QUEEN.phase.*
          # and KANNAKA.presence.* on every beat, while the service showed
          # `active` and the roster quietly went stale. Same lesson as the
          # attention/beacon restoration: a config that replaces a live one
          # must carry every publish the fleet actually performs.
          "QUEEN.phase.>", "QUEEN.announce", "QUEEN.event.>", "queen.event.>",
          "KANNAKA.presence.>", "$KV.QUEEN_AGENTS.>",
          "$JS.API.>", "_INBOX.>"
        ] }
        subscribe: { allow: [">"] }
      }
    }
    # serve — swarm-serve / swarm-worker: recall replies + inbox audit. No write.
    {
      user: serve
      password: $NATS_SERVE_PASS
      permissions: {
        publish: { allow: [
          "KANNAKA.recall.>", "KANNAKA.inbox.audit", "KANNAKA.inbox.reply.>",
          # swarm-serve announces its own skill set (denial observed
          # 2026-08-23). Before this, no scoped identity could publish this
          # branch - only the transitional kannaka_internal.
          "KANNAKA.skills.>",
          # The served-recall event (#1038, kannaka-wave E-004/E-007 ground
          # truth). The daemon publishes it after every reply that returned
          # ids, as `serve`. Without this line the publish is a Permissions
          # Violation that the server logs and the client never sees:
          # publish_event returns Ok, the recall is answered, and no event
          # lands. Found 2026-09-25: of ~1,000 .recall events in E-007's
          # first three days, every one came from grid-colony-one (which
          # connects as anon); kannaka-prime on v0.16.12 answered a recall and
          # published nothing. Only the recall leaf: `serve` still cannot
          # publish remember/forget, so it stays a no-write identity.
          "KANNAKA.events.memory.*.recall",
          # Retained JetStream READS - same gap as radio: anon and queen_agent
          # hold this, so without it authenticating as serve DOWNGRADES the
          # client and its retained QUEEN_PHASES reads fail. Reads only; the
          # STREAM.CREATE denial stays (streams are pre-created by writer).
          "$JS.API.STREAM.MSG.GET.>",
          "_INBOX.>"
        ] }
        subscribe: { allow: [">"] }
      }
    }
    # radio — on-air organ.
    {
      user: radio
      password: $NATS_RADIO_PASS
      permissions: {
        publish: { allow: [
          "RADIO.>", "KANNAKA.attention.ear", "KANNAKA.reactions", "KANNAKA.consciousness",
          # Retained JetStream READS. anon and queen_agent already hold this;
          # without it the radio is strictly WORSE OFF for authenticating and
          # every retained QUEEN_PHASES read fails (observed 2026-08-23).
          # Reads only - CREATE/UPDATE/DELETE/CONSUMER stay absent, so
          # single-writer physics ($JS.API.> belongs to writer) is untouched.
          "$JS.API.STREAM.MSG.GET.>",
          # Per-agent activity events; anon may already publish this branch.
          "KANNAKA.activity.>",
          "_INBOX.>"
        ] }
        subscribe: { allow: ["QUEEN.>", "KANNAKA.>", "ORC.>", "queen.event.>", "_INBOX.>"] }
      }
    }
    # presence — OBC presence daemon (ADR-0013).
    {
      user: presence
      password: $NATS_PRESENCE_PASS
      permissions: {
        publish: { allow: ["KANNAKA.events.obc.>", "KANNAKA.presence.>", "_INBOX.>"] }
        subscribe: { allow: ["KANNAKA.recall.>", "_INBOX.>"] }
      }
    }
    # responder — bounded mouth (ADR-0014). NOTE: NATS `>` must be a whole token,
    # so `responder_>` is invalid; the responder publishes the single subject
    # `KANNAKA.events.obc.responder_escalation` (+ recall requests).
    {
      user: responder
      password: $NATS_RESPONDER_PASS
      permissions: {
        publish: { allow: ["KANNAKA.events.obc.responder_escalation", "KANNAKA.recall.>", "_INBOX.>"] }
        subscribe: { allow: ["KANNAKA.events.obc.dm_message", "_INBOX.>"] }
      }
    }
    # eye — SGA glyph perception.
    {
      user: eye
      password: $NATS_EYE_PASS
      permissions: {
        publish: { allow: ["KANNAKA.attention.eye", "KANNAKA.attention.ear", "EYE.>", "KANNAKA.exemplar.>", "_INBOX.>"] }
        subscribe: { allow: ["EYE.>", "_INBOX.>"] }
      }
    }
    # kannaktopus — QueenSync presence + reactions.
    {
      user: kannaktopus
      password: $NATS_KANNAKTOPUS_PASS
      permissions: {
        publish: { allow: ["QUEEN.phase.>", "QUEEN.announce", "queen.event.>", "KANNAKA.reactions", "KANNAKTOPUS.>", "_INBOX.>"] }
        subscribe: { allow: ["QUEEN.>", "KANNAKTOPUS.>", "KANNAKA.>", "_INBOX.>"] }
      }
    }
    # queen_agent — authenticated QueenSync swarm member (`kannaka swarm join`
    # from owned/trusted agents on laptops and off-box hosts; ADR-0025
    # registration). The anon lane stays open for strangers; this identity adds
    # the ONE write the open lane must never grant — the QUEEN_AGENTS KV roster
    # (any anon could overwrite any agent's entry) — plus the directed
    # ask/inbox lanes, which are injection surfaces from strangers but
    # legitimate between owned agents. NO JetStream admin: streams are
    # pre-created by `writer`; retained reads ride the same MSG.GET grant as
    # the open lane. Kills the per-heartbeat "$KV.QUEEN_AGENTS.<agent>"
    # Permissions Violation that anonymous `swarm join` produces today.
    {
      user: queen_agent
      password: $NATS_QUEEN_AGENT_PASS
      permissions: {
        publish: {
          allow: [
            "KANNAKA.events.>", "KANNAKA.activity.>", "KANNAKA.snapshots.>",
            "KANNAKA.memory.new", "KANNAKA.consciousness",
            "KANNAKA.substrate.phi", "KANNAKA.substrate.absorb.>", "KANNAKA.substrate.recall",
            "KANNAKA.presence.>", "KANNAKA.cores.>",
            "KANNAKA.ask.>", "KANNAKA.inbox.>",
            "QUEEN.phase.>", "QUEEN.announce", "QUEEN.event.>", "queen.event.>",
            "$KV.QUEEN_AGENTS.>",
            "$JS.API.STREAM.MSG.GET.>",
            "_INBOX.>", "_INBOX.req.>", "_INBOX.reqm.>"
          ]
          # Guard entries (absence already denies; these survive future allow
          # additions) — same rationale as the anon block above.
          deny: [
            "KANNAKA.work.>",
            "$JS.API.STREAM.CREATE.>", "$JS.API.STREAM.UPDATE.>",
            "$JS.API.STREAM.DELETE.>", "$JS.API.CONSUMER.>"
          ]
        }
        subscribe: {
          allow: [
            "KANNAKA.events.>", "KANNAKA.activity.>", "KANNAKA.snapshots.>",
            "KANNAKA.substrate.>", "QUEEN.>", "queen.event.>", "KANNAKA.consciousness",
            "KANNAKA.dreams", "KANNAKA.exemplar.>", "KANNAKA.cores.>",
            "KANNAKA.presence.>", "KANNAKA.ask.>", "KANNAKA.inbox.>", "_INBOX.>"
          ]
          # Same private-lane protection as anon: a leaked laptop credential
          # must not read DM plaintext or third-party Hive rooms.
          deny: [
            "KANNAKA.events.nostr.>", "KANNAKA.events.hive.>"
          ]
        }
      }
    }
    # ui-bridge — KANNAKA.*/QUEEN.* -> UI-store translation (read-mostly).
    {
      user: ui_bridge
      password: $NATS_UIBRIDGE_PASS
      permissions: {
        publish: { allow: ["UI.>", "_INBOX.>"] }
        subscribe: { allow: ["KANNAKA.>", "QUEEN.>", "queen.event.>", "RADIO.>", "EYE.>", "_INBOX.>"] }
      }
    }
  
    # attention — restored 2026-08-19: this user existed in production and was
    # LOST in the first deploy of this file, crash-looping
    # kannaka-attention on oracle1 with an Authorization Violation the
    # moment the reload landed. A config that replaces a live one must
    # carry every principal the fleet actually connects as.
    {
      user: attention
      password: $NATS_ATTENTION_PASS
      permissions: {
        publish: { allow: ["$JS.API.STREAM.CREATE.>", "_INBOX.>", "KANNAKA.attention.beam"] }
        subscribe: { allow: [">"] }
      }
    }
    # beacon — restored 2026-08-19: this user existed in production and was
    # LOST in the first deploy of this file, crash-looping
    # kannaka-beacon on oracle1 with an Authorization Violation the
    # moment the reload landed. A config that replaces a live one must
    # carry every principal the fleet actually connects as.
    {
      user: beacon
      password: $NATS_BEACON_PASS
      permissions: {
        publish: { allow: ["$JS.API.STREAM.CREATE.>", "KANNAKA.events.beacon", "_INBOX.>"] }
        subscribe: { allow: [">"] }
      }
    }
  
    # kax_bridge — the Agent-Kax api-server's constellation bridge
    # (lib/constellationBridge.ts; Agent-Kax#401). Read-only on the
    # constellation's public event surface plus publish on its OWN
    # KAX.events.> namespace. Deliberately NOT queen_agent: the bridge is a
    # listener+announcer, not a swarm member — no QUEEN/KV/ask write
    # authority. Grants verified empirically against the live broker
    # 2026-08-21 (all eight bridge subscriptions + KAX.events publish clean).
    {
      user: kax_bridge
      password: $NATS_KAX_BRIDGE_PASS
      permissions: {
        publish: { allow: ["KAX.events.>", "_INBOX.>"] }
        subscribe: {
          allow: [
            "QUEEN.announce", "QUEEN.phase.>", "queen.event.>",
            "KANNAKA.consciousness", "KANNAKA.events.>", "KANNAKA.dreams",
            "KANNAKA.exemplar.>", "KANNAKA.presence.>", "KANNAKA.cores.>",
            "RADIO.events.>", "OBSERVATORY.events.>", "KAX.events.>",
            "_INBOX.>"
          ]
        }
      }
    }
  ]
}

# WebSocket listener (nginx terminates TLS at wss://swarm.ninja-portal.com/nats)
websocket {
  port: 4223
  no_tls: true
  no_auth_user: anon
}
